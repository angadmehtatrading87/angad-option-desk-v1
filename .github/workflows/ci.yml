name: CI

# Runs on every PR and push to main: compile-checks the entire app, runs
# pytest. If this is red, the deploy workflow won't run on the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # FastAPI is imported by app.main even though it's not in
          # requirements.txt yet. Belt-and-braces.
          pip install fastapi pyyaml

      - name: Compile-check
        run: python -m compileall -q app/ tests/

      - name: Run pytest
        run: pytest -x --tb=short
