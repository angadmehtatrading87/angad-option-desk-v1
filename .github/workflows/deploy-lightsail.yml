name: Deploy to Lightsail

# Auto-deploy to AWS Lightsail when main is updated.
#
# What it does:
#   1. SSHes into the Lightsail box using a deploy key stored in GitHub
#      Secrets (no key ever touches your laptop or this repo).
#   2. Fetches the new code on the box, fast-forwards main.
#   3. pip-installs requirements (idempotent; only runs if requirements.txt
#      changed since last deploy).
#   4. Reloads systemd and restarts the IG worker + Telegram control room.
#   5. On failure, posts a Telegram alert if TELEGRAM_BOT_TOKEN +
#      TELEGRAM_CHAT_ID are configured.
#
# Required GitHub Secrets (set them at:
#   https://github.com/<you>/angad-option-desk-v1/settings/secrets/actions):
#
#     LIGHTSAIL_HOST          — IP or DNS of the Lightsail instance
#                               (e.g. 13.234.x.x or your.example.com)
#     LIGHTSAIL_USER          — SSH user, almost always "ubuntu"
#     LIGHTSAIL_SSH_KEY       — full contents of the private key file
#                               (-----BEGIN OPENSSH PRIVATE KEY----- ...
#                               -----END OPENSSH PRIVATE KEY-----)
#     LIGHTSAIL_DEPLOY_PATH   — repo path on the box, e.g.
#                               /home/ubuntu/angad-option-desk-v1
#
# Optional alert secrets:
#     TELEGRAM_BOT_TOKEN      — for failure alerts
#     TELEGRAM_CHAT_ID        — for failure alerts
#
# One-time setup on Lightsail (do this once, manually):
#   1. Generate a fresh deploy key on the Lightsail box:
#        ssh-keygen -t ed25519 -f ~/.ssh/github_deploy -N ""
#      Paste the PUBLIC key (~/.ssh/github_deploy.pub) into the repo as a
#      Deploy Key on github.com under Settings → Deploy keys (read-only).
#
#   2. Generate a separate ed25519 key on your laptop or in 1Password and
#      add its PUBLIC key to ~/.ssh/authorized_keys on Lightsail. Paste the
#      PRIVATE key into the LIGHTSAIL_SSH_KEY GitHub Secret. (The action
#      uses this key to log in; it does NOT pull from GitHub via SSH —
#      it pulls via HTTPS or via the deploy key configured in step 1.)
#
#   3. Make sure your user can run systemctl restart without a password
#      for the relevant units. Add a sudoers rule:
#        ubuntu ALL=NOPASSWD: /bin/systemctl restart ig-execution-worker, \
#          /bin/systemctl restart telegram-control-room, \
#          /bin/systemctl restart angad-option-desk, \
#          /bin/systemctl restart angad-ig-briefing, \
#          /bin/systemctl daemon-reload

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # lets you trigger a deploy manually from the UI

concurrency:
  group: lightsail-deploy
  cancel-in-progress: false  # serialize deploys; never abort a running one

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for context only)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        id: deploy
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_DEPLOY_PATH: ${{ secrets.LIGHTSAIL_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          # Write private key and restrict permissions
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/deploy_key

          # Strip any stray whitespace/newlines from secrets before use
          HOST=$(printf '%s' "$LIGHTSAIL_HOST" | tr -d '[:space:]')
          USER=$(printf '%s' "$LIGHTSAIL_USER" | tr -d '[:space:]')

          # Trust the host key so ssh doesn't prompt
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30"

          $SSH "${USER}@${HOST}" bash -s <<'REMOTE'
          set -euo pipefail

          DEPLOY_PATH="${LIGHTSAIL_DEPLOY_PATH:-/home/ubuntu/angad-option-desk-v1}"
          cd "$DEPLOY_PATH"

          echo "==> capturing pre-deploy commit"
          PREV_SHA=$(git rev-parse --short HEAD)

          echo "==> fetching latest main"
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main

          NEW_SHA=$(git rev-parse --short HEAD)
          echo "==> $PREV_SHA -> $NEW_SHA"

          if [[ "$PREV_SHA" == "$NEW_SHA" ]]; then
              echo "no changes; skipping restart"
              exit 0
          fi

          echo "==> installing requirements (only if requirements.txt changed)"
          if git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -q '^requirements\.txt$'; then
              if [[ -d venv ]]; then
                  ./venv/bin/pip install -r requirements.txt
              else
                  pip3 install -r requirements.txt --break-system-packages || pip3 install -r requirements.txt
              fi
          fi

          echo "==> compile-checking"
          python3 -m compileall -q app/ tests/ || {
              echo "compile failed — refusing to restart"
              exit 1
          }

          echo "==> reloading systemd"
          sudo /bin/systemctl daemon-reload

          echo "==> restarting workers"
          sudo /bin/systemctl restart ig-execution-worker || true
          sudo /bin/systemctl restart telegram-control-room || true
          sudo /bin/systemctl restart angad-option-desk || true
          sudo /bin/systemctl restart angad-ig-briefing || true

          echo "==> deploy finished cleanly"
          REMOTE

      - name: Notify Telegram on failure
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="❌ Deploy to Lightsail FAILED for commit ${GITHUB_SHA::7} on branch ${GITHUB_REF_NAME}. See: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 10 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true
